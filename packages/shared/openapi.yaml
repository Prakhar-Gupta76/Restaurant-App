openapi: 3.0.0
info:
  title: Restaurant App API
  version: 1.0.0
  description: API specification for the Restaurant App
paths:
  /api/auth/signup:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '409':
          description: Email already registered
        '500':
          description: Server error

  /api/auth/login:
    post:
      summary: Authenticate user and get tokens
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid credentials
        '500':
          description: Server error

  /api/auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Authentication
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: Invalid or expired refresh token
        '500':
          description: Server error

  /api/auth/logout:
    post:
      summary: Logout user
      tags:
        - Authentication
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Server error
          
  /api/menu:
    get:
      summary: Get menu items with search, filter, and pagination
      tags:
        - Menu
      parameters:
        - name: category
          in: query
          description: Filter by category
          required: false
          schema:
            type: string
        - name: q
          in: query
          description: Search term for name and description
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number (default 1)
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page (default 12)
          required: false
          schema:
            type: integer
            default: 12
      responses:
        '200':
          description: List of menu items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemsResponse'
        '500':
          description: Server error
    post:
      summary: Create a new menu item
      tags:
        - Menu
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemRequest'
      responses:
        '201':
          description: Menu item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '500':
          description: Server error
          
  /api/menu/{id}:
    get:
      summary: Get a single menu item by ID
      tags:
        - Menu
      parameters:
        - name: id
          in: path
          description: Menu item ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          description: Menu item not found
        '500':
          description: Server error
    put:
      summary: Update a menu item
      tags:
        - Menu
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Menu item ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemRequest'
      responses:
        '200':
          description: Menu item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Menu item not found
        '500':
          description: Server error
    delete:
      summary: Delete a menu item
      tags:
        - Menu
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Menu item ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu item deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Menu item not found
        '500':
          description: Server error
          
  /api/menu/{id}/toggle:
    patch:
      summary: Toggle menu item availability
      tags:
        - Menu
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Menu item ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu item availability toggled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  available:
                    type: boolean
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Menu item not found
        '500':
          description: Server error

components:
  schemas:
    SignupRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "password123"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "password123"

    User:
      type: object
      properties:
        id:
          type: string
          example: "60d21b4667d0d8992e610c85"
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        role:
          type: string
          enum: [customer, admin]
          example: "customer"
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            
    MenuItem:
      type: object
      properties:
        id:
          type: string
          example: "60d21b4667d0d8992e610c85"
        name:
          type: string
          example: "Margherita Pizza"
        description:
          type: string
          example: "Classic pizza with tomato sauce, mozzarella, and basil"
        price:
          type: number
          format: float
          example: 12.99
        category:
          type: string
          example: "pizza"
        imageUrl:
          type: string
          format: uri
          example: "https://example.com/images/margherita.jpg"
        available:
          type: boolean
          example: true
          
    MenuItemRequest:
      type: object
      required:
        - name
        - description
        - price
        - category
      properties:
        name:
          type: string
          example: "Margherita Pizza"
        description:
          type: string
          example: "Classic pizza with tomato sauce, mozzarella, and basil"
        price:
          type: number
          format: float
          example: 12.99
        category:
          type: string
          example: "pizza"
        imageUrl:
          type: string
          format: uri
          example: "https://example.com/images/margherita.jpg"
        available:
          type: boolean
          example: true
          
    MenuItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
        pagination:
          type: object
          properties:
            total:
              type: integer
              example: 50
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 12
            pages:
              type: integer
              example: 5