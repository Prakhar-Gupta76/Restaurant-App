openapi: 3.0.0
info:
  title: Restaurant App API
  version: 1.0.0
  description: API specification for the Restaurant App
paths:
  /api/auth/signup:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '409':
          description: Email already registered
        '500':
          description: Server error

  /api/auth/login:
    post:
      summary: Authenticate user and get tokens
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid credentials
        '500':
          description: Server error

  /api/auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Authentication
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: Invalid or expired refresh token
        '500':
          description: Server error

  /api/auth/logout:
    post:
      summary: Logout user
      tags:
        - Authentication
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: Server error
          
  /api/menu:
    get:
      summary: Get menu items with search, filter, and pagination
      tags:
        - Menu
      parameters:
        - name: category
          in: query
          description: Filter by category
          required: false
          schema:
            type: string
        - name: q
          in: query
          description: Search term for name and description
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number (default 1)
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page (default 12)
          required: false
          schema:
            type: integer
            default: 12
      responses:
        '200':
          description: List of menu items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemsResponse'
        '500':
          description: Server error
    post:
      summary: Create a new menu item
      tags:
        - Menu
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemRequest'
      responses:
        '201':
          description: Menu item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '500':
          description: Server error
          
  /api/menu/{id}:
    get:
      summary: Get a single menu item by ID
      tags:
        - Menu
      parameters:
        - name: id
          in: path
          description: Menu item ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          description: Menu item not found
        '500':
          description: Server error
    put:
      summary: Update a menu item
      tags:
        - Menu
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Menu item ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemRequest'
      responses:
        '200':
          description: Menu item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Menu item not found
        '500':
          description: Server error
    delete:
      summary: Delete a menu item
      tags:
        - Menu
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Menu item ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu item deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Menu item not found
        '500':
          description: Server error
          
  /api/menu/{id}/toggle:
    patch:
      summary: Toggle menu item availability
      tags:
        - Menu
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Menu item ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu item availability toggled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  available:
                    type: boolean
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Menu item not found
        '500':
          description: Server error

  /api/orders:
    post:
      summary: Create a new order
      tags:
        - Orders
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Validation error or unavailable menu items
        '401':
          description: Unauthorized
        '500':
          description: Server error
    get:
      summary: Get all orders (admin only)
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (default 1)
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page (default 10)
          required: false
          schema:
            type: integer
            default: 10
        - name: startDate
          in: query
          description: Filter orders from this date (ISO format)
          required: false
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Filter orders until this date (ISO format)
          required: false
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          description: Filter by order status
          required: false
          schema:
            type: string
            enum: [PLACED, PREPARING, READY, COMPLETED]
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '500':
          description: Server error

  /api/orders/user:
    get:
      summary: Get all orders for the current user
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (default 1)
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page (default 10)
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of user orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /api/orders/{id}:
    get:
      summary: Get a single order by ID
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Order ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not authorized to view this order
        '404':
          description: Order not found
        '500':
          description: Server error

  /api/orders/{id}/status:
    put:
      summary: Update order status (admin only)
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Order ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Order status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Order status updated to PREPARING"
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Validation error or invalid status transition
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Order not found
        '500':
          description: Server error

components:
  schemas:
    SignupRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "password123"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "password123"

    User:
      type: object
      properties:
        id:
          type: string
          example: "60d21b4667d0d8992e610c85"
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        role:
          type: string
          enum: [customer, admin]
          example: "customer"
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            
    MenuItem:
      type: object
      properties:
        id:
          type: string
          example: "60d21b4667d0d8992e610c85"
        name:
          type: string
          example: "Margherita Pizza"
        description:
          type: string
          example: "Classic pizza with tomato sauce, mozzarella, and basil"
        price:
          type: number
          format: float
          example: 12.99
        category:
          type: string
          example: "pizza"
        imageUrl:
          type: string
          format: uri
          example: "https://example.com/images/margherita.jpg"
        available:
          type: boolean
          example: true
          
    MenuItemRequest:
      type: object
      required:
        - name
        - description
        - price
        - category
      properties:
        name:
          type: string
          example: "Margherita Pizza"
        description:
          type: string
          example: "Classic pizza with tomato sauce, mozzarella, and basil"
        price:
          type: number
          format: float
          example: 12.99
        category:
          type: string
          example: "pizza"
        imageUrl:
          type: string
          format: uri
          example: "https://example.com/images/margherita.jpg"
        available:
          type: boolean
          example: true
          
    MenuItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
        pagination:
          type: object
          properties:
            total:
              type: integer
              example: 50
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 12
            pages:
              type: integer
              example: 5

    CreateOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - menuItemId
              - qty
            properties:
              menuItemId:
                type: string
                example: "60d21b4667d0d8992e610c85"
              qty:
                type: integer
                minimum: 1
                example: 2

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PLACED, PREPARING, READY, COMPLETED]
          example: "PREPARING"

    OrderItem:
      type: object
      properties:
        menuItemId:
          type: string
          example: "60d21b4667d0d8992e610c85"
        nameSnapshot:
          type: string
          example: "Margherita Pizza"
        priceSnapshot:
          type: number
          format: float
          example: 12.99
        qty:
          type: integer
          example: 2

    Order:
      type: object
      properties:
        id:
          type: string
          example: "60d21b4667d0d8992e610c85"
        user:
          type: string
          example: "60d21b4667d0d8992e610c85"
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          type: number
          format: float
          example: 25.98
        tax:
          type: number
          format: float
          example: 2.60
        total:
          type: number
          format: float
          example: 28.58
        status:
          type: string
          enum: [PLACED, PREPARING, READY, COMPLETED]
          example: "PLACED"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          type: object
          properties:
            total:
              type: integer
              example: 25
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            pages:
              type: integer
              example: 3

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT