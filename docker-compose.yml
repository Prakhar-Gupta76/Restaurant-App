version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: restaurant-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: restaurant
    volumes:
      - mongo_data:/data/db
    networks:
      - restaurant-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: restaurant-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/restaurant
      JWT_ACCESS_SECRET: your-super-secret-access-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      CLIENT_URL: http://localhost:3000
    depends_on:
      - mongo
    volumes:
      - ./apps/backend/uploads:/app/apps/backend/uploads
    networks:
      - restaurant-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: restaurant-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
    networks:
      - restaurant-network

volumes:
  mongo_data:

networks:
  restaurant-network:
    driver: bridge

